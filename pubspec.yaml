name: nanny_driver
description: A new Flutter project.
publish_to: 'none'
version: 0.2.1+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  google_maps_flutter: ^2.7.0
  firebase_core: ^3.1.1

  nanny_components:
    path: ./nanny_components

  nanny_core:
    path: ./nanny_core
  flutter_localizations:
    sdk: flutter
  collection: ^1.18.0
  webview_flutter: ^4.8.0
  provider: ^6.1.2
  bloc: ^9.0.0
  flutter_bloc: ^9.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  flutter_native_splash: ^2.3.5
  icons_launcher: ^2.1.5

flutter:
  assets:
    - ./nanny_components/assets/
    - ./nanny_components/assets/images/

  fonts:
    - family: Nunito
      fonts:
        - asset: ./nanny_components/assets/fonts/nunito/Nunito-Regular.ttf
        - asset: ./nanny_components/assets/fonts/nunito/Nunito-Black.ttf
        - asset: ./nanny_components/assets/fonts/nunito/Nunito-BlackItalic.ttf
        - asset: ./nanny_components/assets/fonts/nunito/Nunito-Bold.ttf
        - asset: ./nanny_components/assets/fonts/nunito/Nunito-BoldItalic.ttf
        - asset: ./nanny_components/assets/fonts/nunito/Nunito-ExtraBold.ttf
        - asset: ./nanny_components/assets/fonts/nunito/Nunito-ExtraBoldItalic.ttf
        - asset: ./nanny_components/assets/fonts/nunito/Nunito-ExtraLight.ttf
        - asset: ./nanny_components/assets/fonts/nunito/Nunito-ExtraLightItalic.ttf
        - asset: ./nanny_components/assets/fonts/nunito/Nunito-Italic.ttf
        - asset: ./nanny_components/assets/fonts/nunito/Nunito-Light.ttf
        - asset: ./nanny_components/assets/fonts/nunito/Nunito-LightItalic.ttf
        - asset: ./nanny_components/assets/fonts/nunito/Nunito-Medium.ttf
        - asset: ./nanny_components/assets/fonts/nunito/Nunito-MediumItalic.ttf
        - asset: ./nanny_components/assets/fonts/nunito/Nunito-SemiBold.ttf
        - asset: ./nanny_components/assets/fonts/nunito/Nunito-SemiBoldItalic.ttf

    - family: Fregat
      fonts:
        - asset: ./nanny_components/assets/fonts/fregat/Fregat_regular.otf

        - asset: ./nanny_components/assets/fonts/fregat/Fregat_italic.otf
          style: italic

        - asset: ./nanny_components/assets/fonts/fregat/Fregat_bold.otf
          weight: 700

        - asset: ./nanny_components/assets/fonts/fregat/Fregat_bold_italic.otf
          weight: 700
          style: italic

  uses-material-design: true
